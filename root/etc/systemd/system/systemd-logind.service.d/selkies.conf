# systemd-logind opens the system bus during startup. In this image the system
# bus is provided by selkies-dbus.service (the baseimage `svc-dbus` script), not
# by systemd's own dbus.service (which we mask so it cannot fight over
# /run/dbus/system_bus_socket).
#
# Without this ordering logind starts before the bus exists, retries 5 times
# within ~1s and then permanently fails with:
#   Failed to connect to system bus: No such file or directory
#   systemd-logind.service: Start request repeated too quickly.
#
# Debian's own systemd-logind.service.d/dbus.conf only guards on the *presence
# of the dbus binaries*, which are installed, so it does not help here.
[Unit]
After=selkies-dbus.service
Wants=selkies-dbus.service
